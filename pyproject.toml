[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modelrouter"
version = "0.1.0"
description = "代理开放接口的后端封装服务：持有代理 API Key，为 Agent 框架提供统一接口"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "email-validator>=2.1,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/modelrouter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["client/src"]
addopts = "-q"
filterwarnings = [
  "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "client/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
